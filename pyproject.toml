[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-analysis-adhd-epilepsy"
version = "0.1.0"
description = "EEG preprocessing, descriptor extraction, dimensionality reduction, and visualization for ADHD/Epilepsy psychostimulant study."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  { name = "Hamza Abdelhedi" }
]
keywords = ["EEG", "ADHD", "Epilepsy", "psychostimulant"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy<2.4",
  "pandas<3.0.0",
  "mne>=1.13",
  "mne-bids @ git+https://github.com/BabaSanfour/mne-bids@read-epochs-fif",
  "filelock>=3.20.4",
  "pybv>=0.7.3",
  "coco-pipe[decoding,descriptors,foundation] @ git+https://github.com/BabaSanfour/coco-pipe.git@fix/foundation-input-normalization",
  "mne-denoise @ git+https://github.com/mne-tools/mne-denoise.git@main",
  "torch",
  "tqdm",
  "scikit-learn",
  "umap-learn",
  "pyprep",
  "specparam",
  "asrpy",
  "autoreject",
  "pyyaml",
  "pyarrow",
]

[project.urls]
Homepage = "https://github.com/"

[project.scripts]
# Producers (dataset-wide, single config / CLI args), in pipeline order.
eeg-build-patients-metadata = "eeg_adhd_epilepsy.metadata.patients:main"
eeg-cohort-report = "eeg_adhd_epilepsy.metadata.cohort:main"
eeg-to-bids = "eeg_adhd_epilepsy.preproc.to_bids:main"
eeg-preprocess = "eeg_adhd_epilepsy.preproc.base:main"
eeg-save-epochs = "eeg_adhd_epilepsy.preproc.epochs:main"
eeg-descriptors = "eeg_adhd_epilepsy.analysis.extract_descriptors:main"
eeg-verify-descriptors = "eeg_adhd_epilepsy.analysis.verify_descriptors:main"
eeg-merge-descriptors = "eeg_adhd_epilepsy.analysis.merge_descriptors:main"
eeg-foundation-embeddings = "eeg_adhd_epilepsy.analysis.extract_foundation_embeddings:main"
# Analysis consumers (cohort + analysis config).
eeg-dim-reduce = "eeg_adhd_epilepsy.analysis.dimensionality_reduction:main"
eeg-classical-decode = "eeg_adhd_epilepsy.analysis.classical_decoding:main"
eeg-foundation-decode = "eeg_adhd_epilepsy.analysis.foundation_decoding:main"
eeg-align-subject-embeddings = "eeg_adhd_epilepsy.analysis.align_subject_embeddings:main"

[tool.setuptools]
packages = { find = { where = ["."], include = ["eeg_adhd_epilepsy*"], exclude = ["tests*"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "unit: fast, isolated unit test",
    "integration: multi-component / pipeline test",
    "cli: drives a console-script entry point",
    "slow: long-running test",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E203",  # whitespace before ':' (black compat)
    "E266",
]

[tool.ruff.lint.per-file-ignores]
# Module-level constants imported after conditional/setup code on purpose.
"eeg_adhd_epilepsy/utils/constants.py" = ["E402"]
"eeg_adhd_epilepsy/preproc/utils/ica.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.uv.extra-build-variables]
# mne-bids comes from the branch of mne-tools/mne-bids#1679 (read_epochs_bids on
# saved epochs) until that is released. The fork has no tags, so the version is
# given by hand; without it the build reports 0.1.0.dev and fails `mne-bids>=0.20`.
mne-bids = { SETUPTOOLS_SCM_PRETEND_VERSION = "0.21.0.dev0" }

[tool.cluv]
# Jobs are submitted from the project root with
#   cluv submit <cluster> cluster/<NN_script>.sh [sbatch flags] [-- VAR=value ...]
# cluv pushes the commit, checks it out on the cluster, runs `uv sync` there, and
# adds the per-cluster sbatch flags below. See cluster/README.md.

# Same checkout location on every cluster.
project_dir = "$HOME/eeg_analysis_adhd_epilepsy"

# Slurm logs. cluv copies this folder back to the machine that submitted, so it
# holds logs only; analysis outputs go to $SCRATCH/eeg-epilepsy-adhd (cluster/env.sh).
results_path = "$SCRATCH/logs/eeg_analysis_adhd_epilepsy"
results_symlink = "logs"

[tool.cluv.local]
# Where the logs land on a machine without $SCRATCH.
env = { SCRATCH = "$HOME/scratch" }

[tool.cluv.clusters.fir]
# The rrg-kjerbi allocation on fir is CPU only. A GPU stage runs on def-kjerbi
# and needs, on the command line:
#   --account=def-kjerbi --gres=gpu:nvidia_h100_80gb_hbm3_1g.10gb:1 --cpus-per-task=1 --mem=32G
sbatch_args = { account = "rrg-kjerbi" }

[tool.cluv.clusters.trillium-gpu]
# GPU stages only. One H100 comes with 24 cores; --mem is not accepted there.
sbatch_args = { account = "rrg-kjerbi", gpus-per-node = 1 }
