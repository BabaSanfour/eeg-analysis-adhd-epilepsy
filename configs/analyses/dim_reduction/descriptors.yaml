# Analysis/method config — dimensionality reduction over extracted descriptors.
# Pair with a cohort config via --cohort_config. The descriptor table path is
# supplied on the CLI (--descriptor_table_path).
#
# The whole descriptor analysis plan runs in-process from this one config:
# the analysis command sweeps `analysis_modes` and loads each condition once.
input_mode: descriptors
representation: recording

selection_metric: separation_rf_balanced_accuracy
selection_eval_name: med_adhd_vs_ctrl
use_derivatives: true
interactive: true
location_statistic: mean
overwrite: false

# QC mirrors the decoding descriptor QC so dimensionality reduction sees the same
# clean matrix. group_by drives family-scoped masking across analysis units.
qc:
  column_prune:
    enabled: true
    max_missing_rate: 0.2
    drop_constant: true
    # NaN columns are dropped (most NaN first) only until at most 1 % of rows have a NaN;
    # those rows are then dropped, so a few failed fits cost their rows, not their family.
    max_row_drop_rate: 0.01
  outlier:
    z_threshold: 5.0
    group_by: subfamily
    epoch_outlier_fraction: 0.3
    subject_outlier_fraction: 0.2
    # A unit drops an observation flagged in more than this fraction of the QC
    # groups it spans (0.0 = flagged in any group, which empties wide units).
    unit_outlier_group_fraction: 0.2
  min_obs: 3

# Descriptors mix scales (uV^2/Hz power next to 0-1 ratios and entropies), so
# each feature is scaled before reduction: median and interquartile range, then
# clipped so a few extreme values cannot set the axes.
scaling:
  method: robust
  clip: 8.0

# Each analysis mode maps its reducers to the n_components fitted: PCA (linear,
# fitted once at its largest n and sliced) and UMAP (non-linear). More counts can be
# added later: each fit is identified by its own n, so existing fits are reused.
analysis_modes:
  flat:                    {PCA: [2, 3, 5, 10, 20, 50], UMAP: [2, 3, 5, 10]}
  family:                  {PCA: [2, 3, 5, 10, 20, 50], UMAP: [2, 3, 5, 10]}
  subfamily:               {PCA: [2, 3, 5, 10, 20, 50], UMAP: [2, 3, 5, 10]}
  sensor:                  {PCA: [2, 3, 5, 10, 20, 50], UMAP: [2, 3, 5, 10]}
  sensor_within_family:    {PCA: [2, 3, 5, 10, 20, 50], UMAP: [2, 3, 5, 10]}
  feature_within_family:   {PCA: [2, 3, 5, 10, 20, 50], UMAP: [2, 3, 5, 10]}
  descriptor:              {PCA: [2, 3, 5, 10, 20, 50], UMAP: [2, 3, 5, 10]}
