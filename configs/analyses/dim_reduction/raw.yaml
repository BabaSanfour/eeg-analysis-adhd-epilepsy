# Analysis/method config — dimensionality reduction over raw EEG.
# Pair with a cohort config via --cohort_config.
#
#
# Each analysis mode maps its reducers to the n_components fitted: PCA (linear,
# fitted once at its largest n and sliced) and UMAP (non-linear). More counts can be
# added later: each fit is identified by its own n, so existing fits are reused.
input_mode: raw

# Run selection. `selection_eval_name` MUST name an eval declared in the paired
# COHORT config's `evals:` block (cross-checked at load time in utils/config.py);
# `selection_metric` then ranks every fit by that eval's score. `med_adhd_vs_ctrl`
# is the ADHD-vs-control contrast common to the medicated_adhd_vs_controls cohorts.
selection_metric: separation_rf_balanced_accuracy
selection_eval_name: med_adhd_vs_ctrl
use_derivatives: true
interactive: true
overwrite: false

task: clinical
segment_duration: 60.0
overlap: 0.0

# representation: epoch only. Averaging raw resting epochs (not time-locked) to a
# recording cancels the signal, so raw has no recording level. analysis_mode = sensor
# handling: flat concatenates all channels into one vector; sensor keeps each channel
# as its own unit.
representation: epoch
analysis_modes:
  flat:   {PCA: [2, 3, 5, 10, 20, 50], UMAP: [2, 3, 5, 10]}
  sensor: {PCA: [2, 3, 5, 10, 20, 50], UMAP: [2, 3, 5, 10]}
