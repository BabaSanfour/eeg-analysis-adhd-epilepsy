# Leakage-safe classical decoding over saved foundation embeddings.
input_mode: foundation_embeddings
representation: epoch
alignment_diagnostics_population: clinical_task_subset

analysis_modes:
  - flat

transforms:
  - none
  - leace

transform_params:
  # Fold-local LEACE erases the directions whose subject eta^2 is at least eta2, fitted
  # with the condition of each training window.
  leace:
    eta2: 0.5
    condition_column: condition

# When enabled, every transform is decoded both with all dimensions and with
# fold-local PCA after erasure/scaling.
reducer:
  enabled: true
  n_components: 0.95
  whiten: false

feature_selection:
  - name: baseline
    method: none

tuning:
  enabled: true
  scoring: balanced_accuracy
  n_splits: 3

models:
  logreg:
    estimator: LogisticRegression
    params:
      penalty: l2
      solver: liblinear
      class_weight: balanced
      max_iter: 2000
    grid:
      C: [0.01, 0.1, 1.0, 10.0]
  random_forest:
    estimator: RandomForestClassifier
    params:
      n_estimators: 300
      class_weight: balanced
      n_jobs: 1

cv:
  n_splits: 5

# Labels are shuffled within groups and the whole pipeline is refit
# `n_permutations` times, so the smallest p-value is 1 / (n_permutations + 1).
chance_method: permutation
n_permutations: 20
store_null_distribution: false

metrics:
  - balanced_accuracy
  - f1

random_state: 42
