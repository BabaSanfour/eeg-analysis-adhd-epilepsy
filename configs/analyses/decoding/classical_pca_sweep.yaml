# Dim reduction x decoding (2026-11-17): the decoding of classical.yaml (descriptors) after fold-local PCA at
# the sizes the dim-reduction sweep uses (2-50 components) and at 95 % of the variance; the
# all-dimensions decoding is the main run's. Exploration: no feature selection, and the
# binomial test against the larger group's share instead of permutations.


input_mode: descriptors

location_statistic: mean

qc:
  column_prune:
    enabled: true
    max_missing_rate: 0.2
    drop_constant: true
    # NaN columns are dropped (most NaN first) only until at most 1 % of rows have a NaN;
    # those rows are then dropped, so a few failed fits cost their rows, not their family.
    max_row_drop_rate: 0.01
  outlier:
    z_threshold: 5.0
    group_by: measure
    epoch_outlier_fraction: 0.3
    subject_outlier_fraction: 0.2
    # A unit drops an observation flagged in more than this fraction of the QC
    # groups it spans (0.0 = flagged in any group, which empties wide units).
    unit_outlier_group_fraction: 0.2
  min_obs: 3

analysis_modes:
  - flat
  - sensor
  - subfamily
  - descriptor

feature_selection:
  - name: baseline
    method: none

reducer:
  enabled: true
  n_components: [2, 3, 5, 10, 20, 50, 0.95]
  keep_all_dimensions: false
  whiten: false


tuning:
  enabled: true
  scoring: balanced_accuracy
  n_splits: 3

models:
  logreg_enet:
    estimator: LogisticRegression
    analysis_modes:
      - flat
      - sensor
      - subfamily
      - descriptor
    params:
      penalty: elasticnet
      solver: saga
      l1_ratio: 0.5
      class_weight: balanced
      max_iter: 5000
    grid:
      C: [0.01, 0.1, 1.0, 10.0]
      l1_ratio: [0.2, 0.5, 0.8]
  random_forest:
    estimator: RandomForestClassifier
    analysis_modes:
      - flat
      - sensor
      - subfamily
      - descriptor
    params:
      n_estimators: 300
      class_weight: balanced
      n_jobs: 1

cv:
  n_splits: 5

# Labels are shuffled within groups and the whole pipeline is refit
# `n_permutations` times, so the smallest p-value is 1 / (n_permutations + 1).
# Only the units of `permutation_modes` without feature selection are permuted; the
# others get the binomial test of accuracy over recordings, against the majority
# class's share (exploratory units, ranked by their cross-validated score).
chance_method: binomial
n_permutations: 100
permutation_modes:
  - flat
store_null_distribution: false

metrics:
  - accuracy
  - balanced_accuracy
  - f1
  - precision
  - recall
  - roc_auc

session_col: session
subject_col: subject
task: clinical
representation: recording
run_pooled: true
random_state: 42
n_jobs: -1
verbose: true
overwrite: false

detailed_unit_reports: true
detailed_unit_report_modes:
  - flat
report_asset_urls: null
