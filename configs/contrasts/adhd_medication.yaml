# Cohort config: controls and every ADHD child, medicated or not, for the medication
# contrasts (analysis/medication_contrast.py). Outside configs/cohorts so the cohort
# batches do not pick it up.
dataset_name: contrast_adhd_medication
subject_col: subject
conditions:
- EO_baseline
- EC_baseline
match_covariates:
- epilepsy
- autism
group_filters:
- adhd:
  - 0
  psychostimulant:
  - 0
- adhd:
  - 1
filter_col:
- age_group
filter_val:
- - 5-8
  - 9-12
  - 13-18
evals:
- name: adhd_vs_ctrl
  target_col: combined_diagnosis
  group_col: patient_group_id
  positive_class: '1'
  label_map:
    Control: '0'
    Epilepsy: '0'
    ASD: '0'
    ASD+Epilepsy: '0'
    ADHD: '1'
    ADHD+Epilepsy: '1'
    ADHD+ASD: '1'
    ADHD+ASD+Epilepsy: '1'
