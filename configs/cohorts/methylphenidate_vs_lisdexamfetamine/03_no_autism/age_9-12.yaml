# Derived from the pooled family config of the same path (medication contrast).
dataset_name: mphldx_03_no_autism_age_9-12
subject_col: subject
conditions:
- EO_baseline
- EC_baseline
run_pooled: true
match_covariates:
- epilepsy
- autism
group_filters:
- adhd:
  - 1
  autism:
  - 0
  psychostimulant:
  - 1
  psychostimulant_category:
  - Methylphenidate
- adhd:
  - 1
  autism:
  - 0
  psychostimulant:
  - 1
  psychostimulant_category:
  - Lisdexamfetamine
filter_col:
- age_group
filter_val:
- - 9-12
evals:
- name: ldx_vs_mph
  target_col: psychostimulant_category
  group_col: patient_group_id
  positive_class: '1'
  label_map:
    Methylphenidate: '0'
    Lisdexamfetamine: '1'
- name: sex_separation
  target_col: sex
  group_col: patient_group_id
  positive_class: M
- name: condition_separation
  target_col: condition
  group_col: patient_group_id
  positive_class: EC_baseline
