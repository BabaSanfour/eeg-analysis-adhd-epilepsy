# Derived from the pooled family config of the same path (medication contrast).
dataset_name: mphldx_01_all_subjects_female
subject_col: subject
conditions:
- EO_baseline
- EC_baseline
run_pooled: true
match_covariates:
- epilepsy
- autism
group_filters:
- adhd:
  - 1
  psychostimulant:
  - 1
  psychostimulant_category:
  - Methylphenidate
- adhd:
  - 1
  psychostimulant:
  - 1
  psychostimulant_category:
  - Lisdexamfetamine
filter_col:
- sex
- age_group
filter_val:
- - F
- - 5-8
  - 9-12
  - 13-18
evals:
- name: ldx_vs_mph
  target_col: psychostimulant_category
  group_col: patient_group_id
  positive_class: '1'
  label_map:
    Methylphenidate: '0'
    Lisdexamfetamine: '1'
- name: age_separation
  target_col: age_group
  group_col: patient_group_id
  class_order:
  - 5-8
  - 9-12
  - 13-18
- name: condition_separation
  target_col: condition
  group_col: patient_group_id
  positive_class: EC_baseline
